<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find the shortest word-list matches for your letter tiles.">
  <title>Crack the Seal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Letter tile solver</p>
      <h1 id="page-title">Crack the Seal</h1>
      <p class="lede">Enter your tiles. We’ll find the tightest matches hiding in the word list.</p>
    </section>

    <section class="solver-panel" aria-label="Letter tile search">
      <form id="search-form">
        <label for="tiles">Your tiles</label>
        <div class="input-row">
          <input id="tiles" name="tiles" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="e.g. mushroom" autofocus>
          <button type="submit">Search</button>
        </div>
        <div class="form-meta">
          <p id="status" role="status" aria-live="polite">Ready when you are.</p>
          <button class="clear-button" id="clear-button" type="button">Clear</button>
        </div>
      </form>
    </section>

    <section class="results-section" aria-labelledby="results-heading">
      <div class="section-heading">
        <h2 id="results-heading">Matches</h2>
        <span id="result-count" class="result-count"></span>
      </div>
      <div id="results" class="results" aria-live="polite">
        <div class="empty-state">
          <span class="empty-mark" aria-hidden="true">?</span>
          <p>Type a few letters to reveal possible matches.</p>
        </div>
      </div>
    </section>

    <footer>Powered by the Crack the Seal word list</footer>
  </main>
</body>
</html>
