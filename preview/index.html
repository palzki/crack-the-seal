<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Unscramble the event master's letters into a Seal Online name.">
  <meta name="theme-color" content="#233029">
  <title>Crack the Seal</title>
  <link rel="preload" href="fonts/schola-bold.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Crack the Seal</h1>
      <p class="source" id="source">Loading Seal Online names…</p>
    </header>

    <form class="inputs" id="form" autocomplete="off">
      <div class="field">
        <label for="tiles">Letters</label>
        <input id="tiles" type="text" inputmode="text" spellcheck="false" autocapitalize="characters" placeholder="Paste the letters here" autofocus>
      </div>
      <button class="clear" id="clear" type="button" disabled>Clear</button>
    </form>

    <div class="read" id="read" hidden>
      <span class="read-count" id="read-count"></span>
      <span class="read-tiles" id="read-tiles"></span>
    </div>

    <section class="stage" id="stage" aria-live="polite"></section>
    <section class="close" id="close" hidden></section>

    <footer class="footer">Runs entirely in your browser. Nothing you type is sent anywhere.</footer>
  </main>
</body>
</html>
